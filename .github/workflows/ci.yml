name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # .grok/ is gitignored, so the four tests that pin .grok/skills/og docs
      # (brand-check x3, write-atomic x1) are skipped here; they run where .grok/ exists.
      - run: npm test
      - run: npm run typecheck

  # Its own job, so lint reports even when the tests fail.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee /tmp/e2e.log || {
            node -e '
              const log = require("fs").readFileSync("/tmp/e2e.log", "utf8");
              const idx = log.indexOf("failing tests:");
              const tail = idx >= 0 ? log.slice(idx) : log.slice(-4000);
              const chunks = tail.split(/\n(?=test at )/).slice(0, 8);
              for (const c of chunks) {
                const msg = c.replace(/\r?\n/g, " | ").slice(0, 800);
                console.log("::error::" + msg);
              }
            '
            exit 1
          }
